[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corvus-node"
version = "0.1.9"
description = "Corvus-Node — host Node, four engines in Firecracker, vsock only"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Black Rain Labs" }]
dependencies = [
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
gui = ["PySide6"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
corvus = "corvus_node.cli:main"
corvus-node = "corvus_node.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/corvus_node"]

[tool.hatch.build.targets.wheel.force-include]
"gui/corvus_gui" = "corvus_gui"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "gui", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
