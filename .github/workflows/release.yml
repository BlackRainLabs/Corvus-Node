# Publish a GitHub Release for every new version.

# Manual: git tag vX.Y.Z && git push origin vX.Y.Z
# Automatic: merge to main when pyproject version has no release yet.

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: corvus-node-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PY_VER="$(grep -m1 '^version =' pyproject.toml | cut -d'"' -f2)"
          INIT_VER="$(grep -m1 '__version__' src/corvus_node/__init__.py | cut -d'"' -f2)"
          if [[ "$PY_VER" != "$INIT_VER" ]]; then
            echo "pyproject.toml version $PY_VER != __version__ $INIT_VER" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
            if [[ "$VER" != "$PY_VER" ]]; then
              echo "tag v$VER does not match package $PY_VER" >&2
              exit 1
            fi
          else
            VER="$PY_VER"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "v$VER already released"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build wheel and install snapshot
        if: steps.ver.outputs.skip != '1'
        run: |
          unset GIT_AUTHOR_DATE GIT_COMMITTER_DATE SOURCE_DATE_EPOCH
          pip install build
          python -m build --wheel
          VER="${{ steps.ver.outputs.ver }}"
          tar -czf "dist/corvus-node-${VER}-install.tar.gz" \
            install.sh packaging guest src/corvus_node pyproject.toml LICENSE README.md
          cp "dist/corvus-node-${VER}-install.tar.gz" dist/corvus-node-install.tar.gz
      - name: Publish GitHub Release
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unset GIT_AUTHOR_DATE GIT_COMMITTER_DATE SOURCE_DATE_EPOCH
          VER="${{ steps.ver.outputs.ver }}"
          gh release create "v$VER" \
            --target "${GITHUB_SHA}" \
            --title "Corvus-Node v${VER}" \
            --generate-notes \
            dist/*.whl \
            dist/corvus-node-install.tar.gz \
            "dist/corvus-node-${VER}-install.tar.gz"
