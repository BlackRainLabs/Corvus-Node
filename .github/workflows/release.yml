# Publish a GitHub Release (wheel + install snapshot) on version tags.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Build wheel and install snapshot
        run: |
          pip install build
          python -m build --wheel
          VER="${GITHUB_REF_NAME#v}"
          tar -czf "dist/corvus-node-${VER}-install.tar.gz" \
            install.sh packaging guest src/corvus_node pyproject.toml LICENSE README.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Corvus-Node ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.whl \
            dist/corvus-node-*-install.tar.gz
